name: Verify registry
on: [pull_request]
concurrency:
  group: verify-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:upstream
      - run: pnpm upstream:check
      - run: pnpm typecheck
      - run: pnpm registry:build
      - run: pnpm build:upstream
      - run: pnpm build:stylex
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-inputs
          include-hidden-files: true
          retention-days: 3
          path: |
            dist/upstream
            dist/stylex
            generated/upstream
            generated/original-stories/public
            generated/reference/*/.install-complete.json
            generated/reference/*/ui
            generated/reference/*/hooks
            generated/reference/*/source
            generated/reference/*/registry
            generated/reference/*/registry.json
            generated/reference/*/cli.css
            generated/reference/*/tailwind.css
            !**/node_modules/**
            !**/.git/**
            !**/.env*
            !**/.npmrc
  browser:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      ARIAX_STATIC_STORYBOOK: '1'
      ARIAX_TEST_MODE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: storybook-inputs
          path: .
      - run: pnpm exec playwright test tests/parity.spec.ts --grep @static-parity --shard=${{ matrix.shard }}/4
        timeout-minutes: 15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-reports-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
