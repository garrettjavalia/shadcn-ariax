name: Publish AriaX to GitHub Pages

on:
  pull_request:
  push:
    branches: [deploy-github-pages]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-github-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/deploy-github-pages'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: actions/configure-pages@v5
        id: pages
        if: github.event_name != 'pull_request'
      - run: pnpm install --frozen-lockfile
      - if: github.event_name == 'pull_request'
        run: pnpm exec playwright install --with-deps chromium
      - name: Build public AriaX site
        env:
          ARIAX_GTM_ID: ${{ github.event_name != 'pull_request' && vars.ARIAX_GTM_ID || '' }}
          ARIAX_SITE_BASE: ${{ github.event_name == 'pull_request' && format('/{0}', github.event.repository.name) || steps.pages.outputs.base_path }}/
        run: pnpm build:site
      - name: Test public AriaX site
        if: github.event_name == 'pull_request'
        env:
          ARIAX_SITE_BASE: /${{ github.event.repository.name }}/
        run: pnpm test:site
      - name: Check deployment artifact
        if: github.event_name != 'pull_request'
        env:
          ARIAX_GTM_ID: ${{ vars.ARIAX_GTM_ID }}
        run: |
          test -s dist/site/index.html
          test -s dist/site/ja/index.html
          test -s dist/site/docs/components/button/index.html
          if [ -n "$ARIAX_GTM_ID" ]; then
            grep -Fq "https://www.googletagmanager.com/gtm.js?id=$ARIAX_GTM_ID" dist/site/index.html
          fi
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist/site

  deploy:
    if: github.ref == 'refs/heads/deploy-github-pages' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
