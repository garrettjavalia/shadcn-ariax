name: Publish Storybook to GitHub Pages

on:
  push:
    branches: [deploy-github-pages]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/deploy-github-pages'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: actions/configure-pages@v5
        id: pages
      - run: pnpm install --frozen-lockfile
      - run: pnpm registry:check
      - name: Build public AriaX Storybook
        env:
          ARIAX_STORYBOOK_BASE: ${{ steps.pages.outputs.base_path }}/
        run: |
          pnpm build:stylex
          node --import tsx scripts/prepare-pages.ts
      - name: Publish complete source snapshot and Storybook build
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Only generated Storybook files are added to the exact source snapshot.
          git diff --exit-code
          git add --force -- dist/stylex
          tree=$(git write-tree)
          parents=(-p "$SOURCE_SHA")
          if git ls-remote --exit-code --heads origin published-github-pages; then
            git fetch origin published-github-pages
            previous=$(git rev-parse FETCH_HEAD)
            if [ "$tree" = "$(git rev-parse "$previous^{tree}")" ]; then
              exit 0
            fi
            if [ "$previous" != "$SOURCE_SHA" ]; then
              parents=(-p "$previous" -p "$SOURCE_SHA")
            fi
          fi
          commit=$(git commit-tree "$tree" "${parents[@]}" -m "Publish Storybook from $SOURCE_SHA")
          git push origin "$commit:refs/heads/published-github-pages"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/stylex

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
